name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check documentation, registry, and tracked-file boundary
        run: python3 -B scripts/check_public_docs.py
      - name: Test shared data contracts without site packages
        run: python3 -I -S -B -m unittest discover -s tests -v
      - name: Confirm checks did not change tracked files
        run: git diff --exit-code

  task03-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install report-only dependencies
        run: python -m pip install --only-binary=:all: numpy==1.24.4 matplotlib==3.7.5 PyYAML==6.0.2
      - name: Test Task03 reporting under optimized Python
        run: python -O -B -m unittest discover -s tests_torch -p test_task03_report.py -v
      - name: Confirm checks did not change tracked files
        run: git diff --exit-code
