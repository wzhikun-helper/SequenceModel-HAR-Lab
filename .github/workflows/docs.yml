name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check documentation, registry, and tracked-file boundary
        run: python3 -B scripts/check_public_docs.py
      - name: Test shared data contracts without site packages
        run: python3 -I -S -B -m unittest discover -s tests -v
      - name: Confirm checks did not change tracked files
        run: git diff --exit-code
